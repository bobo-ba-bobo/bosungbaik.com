<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random — BOBO</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --black: #080808;
      --white: #F2F0EC;
      --gold: #C9A84C;
      --red: #E63329;
      --dim: #1A1A1A;
      --muted: #555;
      --border: #222;
    }
    html { scroll-behavior: smooth; }
    body { background: var(--black); color: var(--white); font-family: 'Space Grotesk', sans-serif; overflow-x: hidden; cursor: crosshair; }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 9999;
      opacity: 0.4;
    }

    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 20px 40px;
    }
    nav .logo { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 0.15em; color: var(--white); text-decoration: none; }
    nav .home-link { font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: var(--muted); text-decoration: none; text-transform: uppercase; transition: color 0.2s; justify-self: end; }
    nav .home-link:hover { color: var(--white); }
    .nav-pill { display: flex; align-items: center; gap: 2px; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 100px; padding: 5px; }
    .nav-pill a { font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: lowercase; color: var(--muted); text-decoration: none; padding: 7px 16px; border-radius: 100px; transition: background 0.2s, color 0.2s; }
    .nav-pill a:hover { background: var(--white); color: var(--black); }
    .nav-pill a.active { background: var(--white); color: var(--black); }

    .ticker-wrap { position: fixed; bottom: 0; left: 0; right: 0; z-index: 100; background: var(--border); overflow: hidden; padding: 8px 0; border-top: 1px solid #333; }
    .ticker-track { display: flex; white-space: nowrap; animation: ticker 24s linear infinite; }
    .ticker-track span { font-family: 'Bebas Neue', sans-serif; font-size: 14px; letter-spacing: 0.2em; color: var(--muted); padding: 0 40px; }
    .ticker-track span::after { content: '★'; margin-left: 40px; opacity: 0.3; }
    @keyframes ticker { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

    main { padding: 140px 40px 100px; min-height: 100vh; }

    .page-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(80px, 14vw, 200px);
      line-height: 0.88;
      letter-spacing: -0.02em;
      margin-bottom: 80px;
    }

    .empty-state {
      border: 1px dashed var(--border);
      padding: 80px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      min-height: 300px;
    }
    .empty-state p { font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }
    .empty-state .big { font-family: 'Bebas Neue', sans-serif; font-size: 48px; color: var(--border); letter-spacing: 0.05em; }

    footer { padding: 40px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; margin-top: 80px; }
    footer p { font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.15em; color: var(--muted); text-transform: uppercase; }
    footer a { font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.15em; color: var(--muted); text-transform: uppercase; text-decoration: none; transition: color 0.2s; }
    footer a:hover { color: var(--gold); }
  </style>
</head>
<body>
  <nav>
    <a href="/alterego" class="logo">BOBO</a>
    <div class="nav-pill">
      <a href="/alterego/dance">dance</a>
      <a href="/alterego/music">music</a>
      <a href="/alterego/random" class="active">random</a>
    </div>
    <a href="/" class="home-link">← Real Life</a>
  </nav>

  <div class="ticker-wrap">
    <div class="ticker-track">
      <span>DESIGN</span><span>ARCHITECTURE</span><span>UI/UX</span><span>RANDOM</span><span>STUFF</span><span>IDK</span>
      <span>DESIGN</span><span>ARCHITECTURE</span><span>UI/UX</span><span>RANDOM</span><span>STUFF</span><span>IDK</span>
    </div>
  </div>

  <main>
    <h1 class="page-title">RANDOM</h1>
    <div class="empty-state">
      <span class="big">COMING SOON</span>
      <p>Work in progress — check back later</p>
    </div>
  </main>

  <footer>
    <p>© 2026 Bosung Baik</p>
    <a href="/alterego">← Alter Ego</a>
  </footer>
</body>
</html>
