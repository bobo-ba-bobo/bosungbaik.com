<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Startup Portfolio Database</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --orange: #F05A28;
      --orange-light: #FF7A4D;
      --orange-pale: #FFF1EC;
      --navy: #1A2744;
      --navy-mid: #253358;
      --gray-100: #F7F8FA;
      --gray-200: #EDEEF2;
      --gray-300: #D8DAE3;
      --gray-500: #8B90A7;
      --gray-700: #4A4F6B;
      --gray-900: #1E2235;
      --white: #FFFFFF;
      --shadow-sm: 0 1px 3px rgba(26,39,68,0.08);
      --shadow-md: 0 4px 16px rgba(26,39,68,0.10);
      --shadow-lg: 0 12px 40px rgba(26,39,68,0.14);
      --radius: 10px;
      --radius-sm: 6px;
    }

    body {
      font-family: 'Inter', -apple-system, 'Apple SD Gothic Neo', sans-serif;
      background: var(--gray-100);
      color: var(--gray-900);
      min-height: 100vh;
    }

    /* ─── HEADER ─────────────────────────────── */
    .header {
      background: var(--navy);
      padding: 0 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 3px solid var(--orange);
    }

    .header-logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-mark {
      width: 32px;
      height: 32px;
      background: var(--orange);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-mark svg { width: 18px; height: 18px; fill: white; }

    .logo-text {
      font-size: 15px;
      font-weight: 700;
      color: var(--white);
      letter-spacing: -0.3px;
    }

    .logo-sub {
      font-size: 11px;
      font-weight: 400;
      color: rgba(255,255,255,0.5);
      margin-top: 1px;
    }

    .header-right {
      font-size: 12px;
      color: rgba(255,255,255,0.45);
      letter-spacing: 0.5px;
    }

    /* ─── HERO BAND ──────────────────────────── */
    .hero {
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-mid) 100%);
      padding: 52px 48px 44px;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      right: -80px;
      top: -80px;
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, rgba(240,90,40,0.18) 0%, transparent 70%);
      border-radius: 50%;
    }

    .hero::after {
      content: '';
      position: absolute;
      left: 30%;
      bottom: -60px;
      width: 260px;
      height: 260px;
      background: radial-gradient(circle, rgba(240,90,40,0.10) 0%, transparent 70%);
      border-radius: 50%;
    }

    .hero-eyebrow {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      color: var(--orange);
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .hero-title {
      font-size: 36px;
      font-weight: 700;
      color: var(--white);
      letter-spacing: -1px;
      line-height: 1.15;
      margin-bottom: 10px;
    }

    .hero-title span { color: var(--orange); }

    .hero-subtitle {
      font-size: 14px;
      color: rgba(255,255,255,0.5);
      font-weight: 400;
    }

    /* ─── STATS ──────────────────────────────── */
    .stats-row {
      display: flex;
      gap: 1px;
      background: var(--navy-mid);
      border-top: 1px solid rgba(255,255,255,0.06);
    }

    .stat-item {
      flex: 1;
      padding: 20px 28px;
      background: rgba(255,255,255,0.04);
    }

    .stat-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: 26px;
      font-weight: 700;
      color: var(--white);
      letter-spacing: -0.5px;
    }

    .stat-value span {
      font-size: 13px;
      font-weight: 400;
      color: rgba(255,255,255,0.4);
      margin-left: 4px;
    }

    /* ─── MAIN CONTENT ───────────────────────── */
    .main {
      max-width: 1440px;
      margin: 0 auto;
      padding: 36px 48px 80px;
    }

    /* ─── CONTROLS ───────────────────────────── */
    .controls {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .search-box {
      position: relative;
      flex: 1;
      min-width: 240px;
      max-width: 360px;
    }

    .search-box input {
      width: 100%;
      padding: 10px 14px 10px 38px;
      border: 1.5px solid var(--gray-300);
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-family: inherit;
      color: var(--gray-900);
      background: var(--white);
      outline: none;
      transition: border-color 0.15s;
    }

    .search-box input:focus { border-color: var(--orange); }
    .search-box input::placeholder { color: var(--gray-500); }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gray-500);
    }

    .filter-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--gray-500);
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .filter-btn {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1.5px solid var(--gray-300);
      background: var(--white);
      font-size: 12px;
      font-weight: 500;
      color: var(--gray-700);
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
      font-family: inherit;
    }

    .filter-btn:hover { border-color: var(--orange); color: var(--orange); }

    .filter-btn.active {
      background: var(--orange);
      border-color: var(--orange);
      color: white;
    }

    .view-toggle {
      display: flex;
      border: 1.5px solid var(--gray-300);
      border-radius: var(--radius-sm);
      overflow: hidden;
      margin-left: auto;
      background: var(--white);
    }

    .view-btn {
      padding: 8px 14px;
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 13px;
      color: var(--gray-500);
      transition: all 0.15s;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .view-btn.active { background: var(--navy); color: white; }

    /* ─── RESULTS META ───────────────────────── */
    .results-meta {
      font-size: 12px;
      color: var(--gray-500);
      margin-bottom: 16px;
    }

    .results-meta strong { color: var(--gray-900); font-weight: 600; }

    /* ─── CARD GRID ──────────────────────────── */
    #card-view {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--gray-200);
      overflow: hidden;
      transition: box-shadow 0.2s, transform 0.2s;
      cursor: default;
    }

    .card:hover {
      box-shadow: var(--shadow-lg);
      transform: translateY(-2px);
    }

    .card-top {
      padding: 20px 20px 16px;
      border-bottom: 1px solid var(--gray-200);
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }

    .company-initial {
      width: 46px;
      height: 46px;
      border-radius: 10px;
      background: var(--navy);
      color: white;
      font-size: 17px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      letter-spacing: -0.5px;
    }

    .card-title-block { flex: 1; min-width: 0; }

    .card-company {
      font-size: 15px;
      font-weight: 700;
      color: var(--gray-900);
      letter-spacing: -0.3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-project {
      font-size: 11px;
      font-weight: 600;
      color: var(--orange);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-top: 2px;
    }

    .card-flag {
      font-size: 22px;
      flex-shrink: 0;
    }

    .card-desc {
      padding: 14px 20px;
      font-size: 12.5px;
      line-height: 1.6;
      color: var(--gray-700);
      border-bottom: 1px solid var(--gray-200);
      min-height: 68px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-meta {
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 9px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }

    .badge-sector {
      background: var(--navy);
      color: rgba(255,255,255,0.9);
    }

    .badge-round {
      background: var(--gray-200);
      color: var(--gray-700);
    }

    .badge-fund {
      background: var(--orange-pale);
      color: var(--orange);
    }

    .card-financials {
      padding: 12px 20px 16px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      border-top: 1px solid var(--gray-200);
    }

    .fin-item { }

    .fin-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: var(--gray-500);
      text-transform: uppercase;
      margin-bottom: 3px;
    }

    .fin-value {
      font-size: 13px;
      font-weight: 700;
      color: var(--gray-900);
    }

    .fin-value.highlight { color: var(--orange); }

    .fin-value.empty { color: var(--gray-300); font-weight: 400; }

    .card-footer {
      padding: 10px 20px;
      background: var(--gray-100);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--gray-200);
    }

    .footer-date {
      font-size: 11px;
      color: var(--gray-500);
      font-weight: 500;
    }

    .footer-pm {
      font-size: 11px;
      color: var(--gray-700);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .footer-pm::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--orange);
    }

    /* ─── TABLE VIEW ─────────────────────────── */
    #table-view {
      display: none;
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--gray-200);
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    thead tr {
      background: var(--navy);
    }

    thead th {
      padding: 13px 16px;
      text-align: left;
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.7);
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }

    thead th:hover { color: white; }

    tbody tr {
      border-bottom: 1px solid var(--gray-200);
      transition: background 0.12s;
    }

    tbody tr:last-child { border-bottom: none; }

    tbody tr:hover { background: var(--gray-100); }

    tbody td {
      padding: 13px 16px;
      color: var(--gray-900);
      vertical-align: middle;
    }

    .td-company { font-weight: 600; }

    .td-desc {
      color: var(--gray-700);
      max-width: 300px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .td-num {
      font-weight: 600;
      text-align: right;
      font-variant-numeric: tabular-nums;
      color: var(--gray-900);
    }

    .td-num.hl { color: var(--orange); }

    /* ─── SECTOR COLORS ──────────────────────── */
    .s-Defense      { background: #1A2744; }
    .s-Robotics     { background: #2563EB; }
    .s-AI           { background: #7C3AED; }
    .s-Aerospace    { background: #0369A1; }
    .s-Healthcare   { background: #059669; }
    .s-Fintech      { background: #0D9488; }
    .s-Lifestyle    { background: #D97706; }
    .s-Semicon      { background: #B45309; }
    .s-Cybersecurity{ background: #DC2626; }
    .s-Renewable    { background: #16A34A; }
    .s-HPC          { background: #475569; }
    .s-Edutech      { background: #CA8A04; }
    .s-Surveillance { background: #6D28D9; }

    /* ─── EMPTY ──────────────────────────────── */
    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--gray-500);
      grid-column: 1 / -1;
    }

    .empty-state svg { margin-bottom: 16px; opacity: 0.3; }

    .empty-state p { font-size: 14px; }

    /* ─── ANIMATIONS ─────────────────────────── */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card { animation: fadeIn 0.3s ease both; }
  </style>
</head>

<!-- HEADER -->
<header class="header">

  </div>

  <div class="results-meta" id="results-meta">전체 <strong>41</strong>개 기업</div>

  <!-- CARD VIEW -->
  <div id="card-view"></div>

  <!-- TABLE VIEW -->
  <div id="table-view">
    <table>
      <thead>
        <tr>
          <th>기업명</th>
          <th>프로젝트</th>

  </div>

</main>

function getInitial(name) {
  const first = name.charAt(0);
  return /[a-zA-Z]/.test(first) ? first.toUpperCase() : first;
}

function formatInvest(d) {
  if (!d.invest || d.invest === '—') return '<span class="fin-value empty">—</span>';
  const unit = d.currency === 'KRW' ? '' : 'M';
  const sym = d.currency === 'USD' ? '$' : d.currency === 'EUR' ? '€' : d.currency === 'GBP' ? '£' : d.currency === 'JPY' ? '¥' : '';
  if (d.invest.includes('억') || d.invest.includes('M') || d.invest.includes('¥')) {
    return `<span class="fin-value highlight">${d.invest}</span>`;
  }
  return `<span class="fin-value highlight">${sym}${d.invest}${unit}</span>`;
}

function formatPreval(d) {
  if (!d.preval || d.preval === '—') return '<span class="fin-value empty">—</span>';
  const sym = d.currency === 'USD' ? '$' : d.currency === 'EUR' ? '€' : d.currency === 'GBP' ? '£' : '';
  if (d.preval.includes('억')) return `<span class="fin-value">${d.preval}</span>`;
  return `<span class="fin-value">${sym}${d.preval}M</span>`;
}

function renderCards(data) {
  const container = document.getElementById('card-view');
  if (!data.length) {
    container.innerHTML = `<div class="empty-state"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><p>검색 결과가 없습니다</p></div>`;
    return;
  }
  container.innerHTML = data.map((d, i) => {
    const sc = SECTOR_CLASS[d.sector] || 's-Defense';
    return `
      <div class="card" style="animation-delay:${i * 0.03}s">
        <div class="card-top">
          <div class="company-initial">${getInitial(d.company)}</div>
          <div class="card-title-block">
            <div class="card-company" title="${d.company}">${d.company}</div>
            <div class="card-project">Project ${d.project}</div>
          </div>
          <div class="card-flag">${d.flag}</div>
        </div>
        <div class="card-desc">${d.desc}</div>
        <div class="card-meta">
          <span class="badge badge-sector ${sc}">${d.sector}</span>
          <span class="badge badge-round">${d.round}</span>
          <span class="badge badge-fund">${d.fund}</span>
        </div>
        <div class="card-financials">
          <div class="fin-item">
            <div class="fin-label">Pre-Val</div>
            ${formatPreval(d)}
          </div>
          <div class="fin-item">
            <div class="fin-label">모집금액</div>
            ${d.raise && d.raise !== '—' ? `<span class="fin-value">${d.raise.includes('억') ? d.raise : (d.currency==='USD'?'$':d.currency==='EUR'?'€':'')+d.raise+'M'}</span>` : '<span class="fin-value empty">—</span>'}
          </div>
          <div class="fin-item">
            <div class="fin-label">투자금액</div>
            ${formatInvest(d)}
          </div>
        </div>
        <div class="card-footer">
          <span class="footer-date">${d.date}</span>
          ${d.pm && d.pm !== '—' ? `<span class="footer-pm">${d.pm}</span>` : ''}
        </div>
      </div>
    `;
  }).join('');
}

function renderTable(data) {
  const tbody = document.getElementById('table-body');
  if (!data.length) {
    tbody.innerHTML = `<tr><td colspan="10" style="text-align:center;padding:60px;color:var(--gray-500)">검색 결과가 없습니다</td></tr>`;
    return;
  }
  tbody.innerHTML = data.map(d => {
    const sc = SECTOR_CLASS[d.sector] || 's-Defense';
    const sym = d.currency === 'USD' ? '$' : d.currency === 'EUR' ? '€' : d.currency === 'GBP' ? '£' : '';
    return `
      <tr>
        <td class="td-company">${d.company}</td>
        <td><span style="font-size:11px;font-weight:600;color:var(--orange);letter-spacing:0.5px">${d.project}</span></td>
        <td style="font-size:18px">${d.flag}</td>
        <td><span class="badge badge-sector ${sc}" style="font-size:10px">${d.sector}</span></td>
        <td><span class="badge badge-fund" style="font-size:10px">${d.fund}</span></td>
        <td><span class="badge badge-round" style="font-size:10px">${d.round}</span></td>
        <td style="color:var(--gray-500);font-size:12px">${d.date}</td>
        <td class="td-num">${d.preval && d.preval !== '—' ? (d.preval.includes('억') ? d.preval : sym+d.preval+'M') : '—'}</td>
        <td class="td-num hl">${d.invest && d.invest !== '—' ? (d.invest.includes('억')||d.invest.includes('¥') ? d.invest : sym+d.invest+'M') : '—'}</td>
        <td style="font-size:12px;color:var(--gray-700)">${d.pm || '—'}</td>
      </tr>
    `;
  }).join('');
}

function getFiltered() {
  return DATA.filter(d => {
    const matchSector = !activeFilters.sector || d.sector === activeFilters.sector;
    const matchFund   = !activeFilters.fund   || d.fund.includes(activeFilters.fund);
    const q = searchQuery.toLowerCase();
    const matchSearch = !q ||
      d.company.toLowerCase().includes(q) ||
      d.project.toLowerCase().includes(q) ||
      d.sector.toLowerCase().includes(q) ||
      d.desc.toLowerCase().includes(q) ||
      d.fund.toLowerCase().includes(q) ||
      (d.pm && d.pm.includes(q));
    return matchSector && matchFund && matchSearch;
  });
}

function render() {
  const filtered = getFiltered();
  document.getElementById('results-meta').innerHTML = `전체 <strong>${filtered.length}</strong>개 기업`;
  renderCards(filtered);
  renderTable(filtered);
}

  currentView = v;
  document.getElementById('card-view').style.display  = v === 'card'  ? 'grid' : 'none';
  document.getElementById('table-view').style.display = v === 'table' ? 'block': 'none';
  document.getElementById('btn-card').classList.toggle('active', v === 'card');
  document.getElementById('btn-table').classList.toggle('active', v === 'table');
}

// Filter buttons
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    const filter = this.dataset.filter;
    const value  = this.dataset.value;

    if (value === 'more') {
      showMoreSectors = !showMoreSectors;
      renderExtraFilters();
      return;
    }

    // deactivate siblings
    document.querySelectorAll(`.filter-btn[data-filter="${filter}"]`).forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    activeFilters[filter] = value;
    render();
  });
});

function renderExtraFilters() {
  const moreBtn = document.querySelector('[data-value="more"]');
  const existing = document.querySelectorAll('.extra-sector');
  existing.forEach(e => e.remove());

  if (showMoreSectors) {
    moreBtn.textContent = '접기';
    MORE_SECTORS.forEach(s => {
      const btn = document.createElement('button');
      btn.className = 'filter-btn extra-sector';
      btn.dataset.filter = 'sector';
      btn.dataset.value = s;
      btn.textContent = s;
      btn.addEventListener('click', function() {
        document.querySelectorAll('.filter-btn[data-filter="sector"]').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        activeFilters.sector = s;
        render();
      });
      moreBtn.parentNode.insertBefore(btn, moreBtn);
    });
  } else {
    moreBtn.textContent = '+더보기';
  }
}

// Search
document.getElementById('search-input').addEventListener('input', function() {
  searchQuery = this.value;
  render();
});

// Initial render
render();
</script>
</body>
</html>
