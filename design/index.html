<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Design - Bosung Baik</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
  <link rel="stylesheet" href="/assets/style.css">
  <style>
    .alter-ego-wrap {
      min-height: calc(100vh - 200px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .alter-ego-link {
      font-size: clamp(48px, 10vw, 120px);
      font-weight: 500;
      letter-spacing: -0.03em;
      color: #000;
      text-decoration: none;
      display: flex;
      align-items: baseline;
      gap: 16px;
      transition: opacity 0.2s;
    }

    .alter-ego-link:hover {
      opacity: 0.4;
    }

    .alter-ego-arrow {
      font-size: 0.5em;
      letter-spacing: 0;
    }
  </style>
</head>
<body>
  <div class="scroll-progress"></div>

  <nav>
    <div class="container">
      <div class="nav-name"><a href="/">Bobo's Home</a></div>
      <button class="nav-toggle" onclick="document.querySelector('.nav-links').classList.toggle('open')">
        <span></span><span></span>
      </button>
      <ul class="nav-links">
        <li><a href="/about">About</a></li>
        <li><a href="/quarterly-reports">Reports</a></li>
        <li><a href="/writings">Writings</a></li>
      </ul>
    </div>
  </nav>

  <main>
    <div class="container">
      <a href="/" class="back-link">Home</a>
      <div class="alter-ego-wrap">
        <a href="/alterego" class="alter-ego-link">
          ALTER EGO <span class="alter-ego-arrow">↗</span>
        </a>
      </div>
    </div>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2026 Bobo's Home</p>
    </div>
  </footer>

  <script>
    const scrollProgress = document.querySelector('.scroll-progress');
    window.addEventListener('scroll', () => {
      const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
      const scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
      scrollProgress.style.width = ((scrollTop / scrollHeight) * 100) + '%';
    });
  </script>
</body>
</html>
